name: Sincronizar Cursos RegistraMEF

on:
  schedule:
    # 06:00 AM y 12:00 PM hora de Perú (UTC -5)
    - cron: '0 11 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch: # Permite ejecutar manualmente con un clic en GitHub

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl unzip
          sudo apt-get install -y google-chrome-stable || true

      - name: Ejecutar Extractor de Cursos MEF
        run: |
          python scraper.py

      - name: Guardar y subir cambios a GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/cursos.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync: Actualización diaria de cursos RegistraMEF" && git push)
